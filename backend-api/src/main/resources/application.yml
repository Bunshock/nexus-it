spring:
  application:
    name: note-app-for-it
  # No default active profile — deliberate. A profile MUST be chosen explicitly:
  #   - production: SPRING_PROFILES_ACTIVE=sqlserver (the datasource only exists there;
  #     forgetting it now fails startup loudly instead of silently falling back to dev).
  #   - local dev:  pinned to `dev` by the spring-boot-maven-plugin config (mvn spring-boot:run)
  #     and by the surefire config (test run). The `dev` profile is what enables H2 + the
  #     dev seed + POST /auth/dev-login, so it must never be the default a package could inherit.
  flyway:
    enabled: false # enabled explicitly under the sqlserver profile below —
                    # V1/V2 are SQL-Server T-SQL (IF OBJECT_ID, IDENTITY,
                    # filtered indexes) that H2 cannot run. Repository tests use
                    # hand-maintained H2 stand-in schemas instead.

# Non-secret app policy — desktop-app-first-release CLAUDE.md §"Config files"
# equivalents that made sense to keep server-side. Real per-org values belong
# in an environment-specific application-*.yml or env vars, never here.
middleware:
  idp:
    issuer-uri: "" # OIDC issuer URL, e.g. https://idp.example/realms/xxx — blank
                    # until Keycloak is reachable; GET /auth/config degrades to
                    # a 503 rather than crashing startup when unset.
    client-id: ""
    allowed-group-name: "" # blank = group-membership gate skipped, matches the
                            # desktop app's own adAccess.allowedGroupName default
  session:
    idle-timeout-minutes: 120
    absolute-timeout-minutes: 720
    sweep-interval-minutes: 5 # SessionStore.scheduledSweep cadence — proactively evict
                              # expired in-memory sessions instead of only on next access
    max-sessions: 50000       # last-resort ceiling; create() prunes then evicts LRU past this
  security:
    encryption-key: "" # AES-256/GCM key (base64) for smtp_password_encrypted — blank until set;
                        # generate per-deployment via `openssl rand -base64 32`, never commit a
                        # real value here. Blank = EncryptionService fails loudly (503), matching
                        # the idp.issuer-uri "genuinely open" convention above.
  directory:
    base-url: "" # org directory (Active Directory) REST API base, e.g. http://ad-api-host:8099 —
                  # blank => GET /api/v1/directory/users returns 503 DIRECTORY_NOT_CONFIGURED.
                  # Real value via MIDDLEWARE_DIRECTORY_BASEURL.
    token: ""    # Bearer service token for the directory API. Blank => 503. Real value via
                  # MIDDLEWARE_DIRECTORY_TOKEN, never committed.
  glpi:
    # GLPI adapter (Tier 3/4 mapping config — see backend-api/glpi-adapter-notes.md).
    base-url: ""  # GLPI HL API base, e.g. https://glpi.example/api.php/v1 — blank => 503
                   # GLPI_NOT_CONFIGURED. Real value via MIDDLEWARE_GLPI_BASEURL.
    app-token: "" # shared App-Token, one per deployment, admin-set via MIDDLEWARE_GLPI_APPTOKEN.
                   # (Each technician sets their own user_token via PUT /api/v1/me/glpi-token.)
    default-bucket: UNAVAILABLE # bucket for states_id = 0 / null / unmapped
    state-buckets: # GLPI states_id -> availability bucket (E1a, confirmed 2026-09-07)
      33: AVAILABLE
      31: IN_USE
      40: IN_USE
      34: IN_USE
      36: IN_USE
      35: UNAVAILABLE
      42: UNAVAILABLE
      43: UNAVAILABLE
      44: UNAVAILABLE
      45: UNAVAILABLE
      46: UNAVAILABLE
      47: UNAVAILABLE
      48: UNAVAILABLE
    sync-targets: # note movement -> GLPI states_id to write (confirmed 2026-09-07; uniform for assets + Peripherals)
      ENTREGA: 31
      ENTREGA_PERMANENTE: 31
      PRESTAMO: 34
      DEVOLUCION: 33
      RETURN: 33
      LOST: 45
    generic-manufacturer-id:  # one, global — the GLPI "Genérico" Manufacturer id, once the row exists
    generic-type-ids: {}      # { Computer: <id>, Peripheral: <id>, Phone: <id>, ... } per GLPI itemtype
    generic-model-ids: {}     # { Computer: <id>, Peripheral: <id>, Phone: <id>, ... }
    sede-location-ids: {}     # { "<sede name>": <GLPI Location id> } — built from GET /Location

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:notesit;MODE=MSSQLServer;DATABASE_TO_LOWER=FALSE
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  # No Flyway migration runs in dev — V1__init.sql is SQL-Server-only T-SQL.
  # This profile is for booting the app and exercising the auth/security
  # wiring only, not for exercising real catalog/notes SQL against H2.

---
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=notesit;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    enabled: true
    locations: classpath:db/migration

# The OpenAPI spec + Swagger UI are a dev convenience only — not published on the
# deployed instance. The contract lives in backend-contract.md; the running API
# shape shouldn't be an unauthenticated endpoint in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
